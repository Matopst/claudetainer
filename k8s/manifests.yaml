apiVersion: apps/v1
kind: Deployment
metadata:
  name: claudetainer
  namespace: default
  labels:
    app: claudetainer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claudetainer
  template:
    metadata:
      labels:
        app: claudetainer
    spec:
      serviceAccountName: claudetainer
      containers:
        - name: claude
          image: ghcr.io/matopst/claudetainer:latest
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
                  optional: true
          stdin: true
          tty: true
