apiVersion: v1
kind: ServiceAccount
metadata:
  name: claudetainer
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claudetainer
rules:
  # Read all resources
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Exec into pods
  - apiGroups: [""]
    resources: ["pods/exec", "pods/attach"]
    verbs: ["create"]
  # Read pod logs
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claudetainer
subjects:
  - kind: ServiceAccount
    name: claudetainer
    namespace: default
roleRef:
  kind: ClusterRole
  name: claudetainer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claudetainer
  namespace: default
  labels:
    app: claudetainer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claudetainer
  template:
    metadata:
      labels:
        app: claudetainer
    spec:
      serviceAccountName: claudetainer
      containers:
        - name: claude
          image: ghcr.io/matopst/claudetainer:latest
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          stdin: true
          tty: true
